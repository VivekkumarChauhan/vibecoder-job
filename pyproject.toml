[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-narrative-director"
version = "1.0.0"
description = "AI-powered Narrative Video Director for multicam podcast editing"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N806", "E402", "RUF001", "RUF002", "RUF003"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "SIM117", "F841", "B007"]


[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rules: editorial rule regression tests",
    "fault: fault injection tests",
    "groq: Groq API failure mode tests",
    "integration: full pipeline integration tests",
    "unit: unit tests per stage",
]
addopts = "-v --tb=short"
